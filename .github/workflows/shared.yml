name: shared

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests de `shared` en el simulador de iPhone (necesita macOS).
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Tests en el simulador de iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-ios
          path: shared/build/reports/tests

  # Tests de `shared` en un emulador de Android (con KVM, en Linux) y verificación del esquema.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verificar el esquema y las migraciones de la base
        run: ./gradlew :shared:verifyCommonMainMiGastoDbMigration --no-daemon
      - name: Permitir KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests en el emulador de Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-android
          path: shared/build/reports
