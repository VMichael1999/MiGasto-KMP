name: shared

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Estilo del código (ktlint) y cobertura de la lógica compartida. Corre en la JVM: es lo más rápido.
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Estilo (ktlint) de shared y androidApp
        run: ./gradlew :shared:ktlintCheck :androidApp:ktlintCheck --no-daemon
      - name: Verificar el esquema y las migraciones de la base
        run: ./gradlew :shared:verifyCommonMainMiGastoDbMigration --no-daemon
      - name: Cobertura de la lógica compartida (mínimo 80 %)
        run: ./gradlew :shared:koverVerify :shared:koverHtmlReport --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: shared/build/reports/kover/html

  # Tests de `shared` en el simulador de iPhone (necesita macOS).
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Tests en el simulador de iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-ios
          path: shared/build/reports/tests

  # La app de iPhone: compila `iosApp` (la app y sus extensiones) para el simulador. El proyecto de Xcode ya está en el
  # repo; el espacio de trabajo de CocoaPods y el podspec de `shared` se generan aquí. Sin firma de desarrollador.
  ios-app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Usar el Xcode más nuevo instalado
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Generar el podspec y el framework vacío de shared, y el espacio de trabajo de CocoaPods
        run: |
          ./gradlew :shared:podspec :shared:generateDummyFramework --no-daemon
          cd iosApp && pod install
      # El framework de Kotlin solo se compila para arm64 (el simulador de este Mac): por eso ARCHS=arm64.
      - name: Compilar la app para el simulador (sin firma)
        run: |
          xcodebuild -workspace iosApp/MiGasto.xcworkspace -scheme MiGasto -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios \
            ARCHS=arm64 CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES build
      - name: Comprobar que las extensiones quedaron dentro de la app
        run: |
          app=build/ios/Build/Products/Debug-iphonesimulator/MiGasto.app
          ls "$app/PlugIns"
          test -d "$app/PlugIns/MiGastoCompartir.appex"
          test -d "$app/PlugIns/MiGastoWidgets.appex"

  # La app de Android: compila las dos versiones y corre los tests de `shared` y las pruebas de interfaz
  # en un emulador (con KVM, en Linux).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar la app (depuración y producción)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon
      - name: Permitir KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests en el emulador de Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Un teléfono de tamaño normal: el perfil por defecto es una pantalla de 320x640 donde las pruebas de interfaz no ven lo de abajo.
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest :androidApp:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-android
          path: |
            shared/build/reports
            androidApp/build/reports
